<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>URL Shortener — Stats</title>
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white shadow p-4">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <a href="/" class="text-xl font-semibold">URL Shortener</a>
      <span class="text-sm text-gray-500">Stats</span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4 space-y-6">
    <!-- Status / messages -->
    <div id="status" class="text-sm text-gray-600">
      Loading stats...
    </div>

    <!-- Stats card -->
    <section id="stats-card" class="bg-white p-4 rounded shadow hidden">
      <h2 class="text-lg font-medium mb-3">Link details</h2>

      <dl class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
        <div>
          <dt class="text-gray-500">Short code</dt>
          <dd id="code" class="font-mono text-gray-900"></dd>
        </div>

        <div>
          <dt class="text-gray-500">Short URL</dt>
          <dd id="short_url" class="text-blue-600 break-words"></dd>
        </div>

        <div class="sm:col-span-2">
          <dt class="text-gray-500">Target URL</dt>
          <dd id="target_url" class="break-words"></dd>
        </div>

        <div>
          <dt class="text-gray-500">Total clicks</dt>
          <dd id="clicks" class="text-gray-900"></dd>
        </div>

        <div>
          <dt class="text-gray-500">Last clicked</dt>
          <dd id="last_clicked" class="text-gray-900"></dd>
        </div>

        <div>
          <dt class="text-gray-500">Created at</dt>
          <dd id="created_at" class="text-gray-900"></dd>
        </div>
      </dl>

      <div class="mt-4 flex gap-2">
        <a id="open-short"
           href="#"
           target="_blank"
           class="px-3 py-2 text-sm bg-blue-600 text-white rounded">
          Open short link
        </a>
        <a href="/" class="px-3 py-2 text-sm border rounded">
          Back to dashboard
        </a>
      </div>
    </section>
  </main>

  <script src="/code.js"></script>
</body>
</html>
