<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>URL Shortener — Dashboard</title>
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white shadow p-4">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-semibold">URL Shortener</h1>
      <span class="text-sm text-gray-500">Dashboard</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    <!-- Create link form (we will wire it up later) -->
    <section class="bg-white p-4 rounded shadow">
      <h2 class="font-medium mb-3">Create a short link</h2>
      <form id="create-form" class="space-y-3">
        <div class="flex flex-col gap-2">
          <label class="text-sm text-gray-700">
            Target URL
            <input id="target_url"
                   class="mt-1 w-full p-2 border rounded"
                   placeholder="https://example.com/some/long/link" />
          </label>

          <label class="text-sm text-gray-700">
            Custom code (optional, 6–8 letters/numbers)
            <input id="custom_code"
                   class="mt-1 w-full p-2 border rounded"
                   placeholder="e.g. docs123" />
          </label>
        </div>

        <button id="create-btn"
                class="mt-2 px-4 py-2 bg-blue-600 text-white rounded">
          Create
        </button>

        <p id="form-msg" class="text-sm mt-2"></p>
      </form>
    </section>

    <!-- Links table (we will fill this from JS later) -->
    <section class="bg-white p-4 rounded shadow">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-medium">All links</h2>
        <input id="search"
               class="p-2 border rounded text-sm"
               placeholder="Search by code or URL" />
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-left text-gray-600">
            <tr>
              <th class="p-2">Code</th>
              <th class="p-2">Target</th>
              <th class="p-2">Clicks</th>
              <th class="p-2">Last clicked</th>
              <th class="p-2">Actions</th>
            </tr>
          </thead>
          <tbody id="links-body">
            <tr>
              <td colspan="5" class="p-4 text-gray-500">
                Loading links...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
